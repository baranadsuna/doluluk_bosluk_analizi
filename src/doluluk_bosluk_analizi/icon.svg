<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background rounded card -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#gradBg)" stroke="#334155" stroke-width="2"/>
  
  <!-- Zone outline (gray boundary) -->
  <polygon points="10,14 54,12 56,52 14,54" fill="#334155" fill-opacity="0.35" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,2"/>
  
  <!-- Building Footprints (Solid Black/Dark Nolli Blocks) -->
  <rect x="16" y="18" width="12" height="10" rx="1.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="34" y="18" width="16" height="12" rx="1.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="18" y="34" width="14" height="14" rx="1.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="38" y="36" width="12" height="10" rx="1.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  
  <!-- Accent Solid-Void Metric Indicator -->
  <circle cx="48" cy="48" r="10" fill="url(#gradAcc)"/>
  <text x="48" y="52" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">%</text>
</svg>
